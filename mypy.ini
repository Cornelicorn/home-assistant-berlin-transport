[mypy]
# Minimum python version for HA 2025.4
python_version = 3.13
strict = true
# `custom_components` has no __init__.py. Name the modules of the integration
# from the repository root, as the tests import them, and not just from
# `berlin_transport`.
explicit_package_bases = true

# Ships without type information.
[mypy-pytest_homeassistant_custom_component.*]
ignore_missing_imports = true
